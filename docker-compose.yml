version: "3.8"

services:

  web:
    build: .
    container_name: empresa_web
    ports:
      - "3000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 256M   # Limita memoria a 256 MB

  db:
    image: mysql:8.0
    container_name: empresa_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: empresa_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-config:/etc/mysql/conf.d  # Config personalizada de MySQL
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 512M   # Limita MySQL a 512 MB

  reportday:
    build: ./my-projectv2
    container_name: reportday
    ports:
      - "4000:80"
    volumes:
      - ./my-projectv2:/var/www/html
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default

volumes:
  mysql_data:

networks:
  default: